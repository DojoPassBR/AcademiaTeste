<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DojoPass</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.svg" alt="Logo">
    <h1>Área da Academia</h1>
  </div>
</header>

<main class="app-main">
  <div class="card">
    <h2>Entrar</h2>
    <form id="form-login">
      <label for="academia">Nome da academia</label>
      <div class="slug-input-wrap">
        <input type="text" id="academia" required autocomplete="organization" inputmode="url"
          autocapitalize="none" autocorrect="off" spellcheck="false"
          aria-describedby="academia-hint">
        <span class="slug-suffix" aria-hidden="true">.dojopass.com.br</span>
      </div>
      <small id="academia-hint">Ex.: jairo → jairo.dojopass.com.br</small>

      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" required>

      <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="switch-link">Ainda não tem cadastro? <a href="cadastro.html">Criar cadastro</a></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="tenant-context.js"></script>
<script>
const SLUG_TENANT_REGEX = /^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/;

const form = document.getElementById("form-login");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn-entrar");
const campoAcademia = document.getElementById("academia");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg show " + type;
}

const sugerido = typeof slugTenantSugerido === "function" ? slugTenantSugerido() : null;
if (sugerido) {
  campoAcademia.value = sugerido;
  document.getElementById("email").focus();
} else {
  campoAcademia.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const academiaSlugBruto = campoAcademia.value;
  const academiaSlug = typeof normalizarSlugTenant === "function"
    ? normalizarSlugTenant(academiaSlugBruto)
    : academiaSlugBruto.trim().toLowerCase();
  campoAcademia.value = academiaSlug;

  if (!academiaSlug || !SLUG_TENANT_REGEX.test(academiaSlug)) {
    showMsg("Digite o nome da academia usando só letras minúsculas, números e hífen (ex.: jairo).", "error");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  btn.disabled = true;
  btn.textContent = "Verificando academia...";

  const resultado = await resolverTenantPorSlug(academiaSlug);
  if (!resultado.ok) {
    if (resultado.motivo === "nao-encontrada") {
      showMsg('Academia não encontrada. Confira o nome antes de ".dojopass.com.br".', "error");
    } else if (resultado.motivo === "rede") {
      showMsg("Não foi possível verificar a academia agora. Tente de novo em instantes.", "error");
    } else {
      showMsg("Digite o nome da academia usando só letras minúsculas, números e hífen (ex.: jairo).", "error");
    }
    btn.disabled = false;
    btn.textContent = "Entrar";
    return;
  }

  btn.textContent = "Entrando...";

  try {
    const local = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    if (local) {
      window.localStorage.removeItem("firebase:authUser:" + firebaseConfig.apiKey + ":[DEFAULT]");
      window.localStorage.removeItem("dojopassDevAdmin");
    }

    const cred = await auth.signInWithEmailAndPassword(email, senha);
    let ehAdmin = false;
    let temMembership = false;
    try {
      const membershipDoc = await db.collection("users").doc(cred.user.uid).collection("memberships").doc(DOJOPASS_TENANT.tenantId).get();
      temMembership = membershipDoc.exists;
      const role = temMembership ? membershipDoc.data().role : null;
      ehAdmin = role === "admin" || role === "owner";
    } catch (tenantErr) {
      console.warn("[login] Não foi possível ler o membership do tenant; tentando admin legado.", tenantErr);
    }
    if (!ehAdmin) {
      const adminGlobalDoc = await db.collection("admins").doc(cred.user.uid).get();
      ehAdmin = adminGlobalDoc.exists;
    }
    if (!ehAdmin) {
      let temCadastroAluno = false;
      try {
        const alunoDoc = await tenantDocRef("alunos", cred.user.uid).get();
        temCadastroAluno = alunoDoc.exists;
      } catch (alunoErr) {
        console.warn("[login] Não foi possível ler o cadastro do aluno no tenant.", alunoErr);
      }
      if (!temMembership && !temCadastroAluno) {
        await auth.signOut();
        showMsg("Sua conta não pertence a esta academia.", "error");
        btn.disabled = false;
        btn.textContent = "Entrar";
        return;
      }
    }
    window.location.href = ehAdmin ? "admin.html" : "checkin.html";
  } catch (err) {
    console.error("[login] Falha ao entrar", err);
    const local = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const detalhe = local && err && err.code ? " (" + err.code + ")" : "";
    showMsg("Não foi possível entrar. Confira e-mail e senha." + detalhe, "error");
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
