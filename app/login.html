<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DojoPass</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.svg" alt="Logo">
    <h1>Área do Aluno</h1>
  </div>
</header>

<main class="app-main">
  <div class="card">
    <h2>Entrar</h2>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" required>

      <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="switch-link">Ainda não tem cadastro? <a href="cadastro.html">Criar cadastro</a></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="tenant-context.js"></script>
<script>
const form = document.getElementById("form-login");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn-entrar");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg show " + type;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  btn.disabled = true;
  btn.textContent = "Entrando...";

  try {
    const local = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    if (local) {
      window.localStorage.removeItem("firebase:authUser:" + firebaseConfig.apiKey + ":[DEFAULT]");
      window.localStorage.removeItem("dojopassDevAdmin");
    }

    const cred = await auth.signInWithEmailAndPassword(email, senha);
    await ensureTenantContext();
    let ehAdmin = false;
    try {
      const membershipDoc = await db.collection("users").doc(cred.user.uid).collection("memberships").doc(DOJOPASS_TENANT.tenantId).get();
      const role = membershipDoc.exists ? membershipDoc.data().role : null;
      ehAdmin = role === "admin" || role === "owner";
    } catch (tenantErr) {
      console.warn("[login] Não foi possível ler o membership do tenant; tentando admin legado.", tenantErr);
    }
    if (!ehAdmin) {
      const adminGlobalDoc = await db.collection("admins").doc(cred.user.uid).get();
      ehAdmin = adminGlobalDoc.exists;
    }
    window.location.href = ehAdmin ? "admin.html" : "checkin.html";
  } catch (err) {
    console.error("[login] Falha ao entrar", err);
    const local = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const detalhe = local && err && err.code ? " (" + err.code + ")" : "";
    showMsg("Não foi possível entrar. Confira e-mail e senha." + detalhe, "error");
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
