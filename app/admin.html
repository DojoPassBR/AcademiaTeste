<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Professor - Academia Exemplo</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.svg" alt="Logo">
    <h1>Painel do Professor</h1>
  </div>
  <span class="sair" id="btn-sair">Sair</span>
</header>

<main class="app-main wide">
  <div class="card" id="card-negado" style="display:none;">
    <h2>Acesso restrito</h2>
    <p>Esta área é exclusiva para professores. Se você é professor e está vendo esta mensagem, peça para o administrador liberar seu acesso.</p>
  </div>

  <div id="conteudo" style="display:none;">
    <div class="card">
      <div class="card-header-row">
        <h2>Alunos cadastrados</h2>
        <button type="button" class="btn-secundario" id="btn-relatorio">Imprimir relatório</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="tabela-alunos">
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Faixa</th><th>Nascimento</th><th>Presenças</th><th>Mensalidade</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="6">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <span class="close" id="modal-close">&times;</span>
    <h2 id="modal-titulo">Histórico</h2>
    <ul class="checkin-list" id="modal-lista"></ul>
  </div>
</div>

<div class="only-print" id="relatorio-impressao"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const btnSair = document.getElementById("btn-sair");
const cardNegado = document.getElementById("card-negado");
const conteudo = document.getElementById("conteudo");
const tabelaAlunos = document.querySelector("#tabela-alunos tbody");
const modalBackdrop = document.getElementById("modal-backdrop");
const modalTitulo = document.getElementById("modal-titulo");
const modalLista = document.getElementById("modal-lista");
const modalClose = document.getElementById("modal-close");
const btnRelatorio = document.getElementById("btn-relatorio");
const relatorioImpressao = document.getElementById("relatorio-impressao");

const BELT_COLORS = {
  "Branca": "#999999", "Cinza": "#888888", "Amarela": "#e0b400", "Laranja": "#e07a00",
  "Verde": "#2e9e3e", "Azul": "#1a5fd0", "Roxa": "#6a1ab0", "Marrom": "#7a4a1a", "Preta": "#111111"
};

btnSair.addEventListener("click", () => auth.signOut().then(() => window.location.href = "login.html"));
modalClose.addEventListener("click", () => modalBackdrop.classList.remove("show"));
btnRelatorio.addEventListener("click", gerarRelatorio);

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const adminDoc = await db.collection("admins").doc(user.uid).get();
  if (!adminDoc.exists) {
    cardNegado.style.display = "block";
    return;
  }

  conteudo.style.display = "block";
  carregarAlunos();
});

async function carregarAlunos() {
  const snap = await db.collection("alunos").orderBy("nome").get();

  if (snap.empty) {
    tabelaAlunos.innerHTML = "<tr><td colspan='6'>Nenhum aluno cadastrado.</td></tr>";
    return;
  }

  tabelaAlunos.innerHTML = "";

  for (const doc of snap.docs) {
    const aluno = doc.data();
    const checkinsSnap = await db.collection("checkins").where("alunoId", "==", doc.id).get();

    const tr = document.createElement("tr");
    const cor = BELT_COLORS[aluno.faixa] || "#666";
    const emDia = (aluno.mensalidadeStatus || "pendente") === "pago";

    // Nome, telefone e faixa vêm do cadastro do próprio aluno (conteúdo livre) —
    // nunca colocar em innerHTML. textContent escapa qualquer HTML/script.
    const tdNome = document.createElement("td");
    tdNome.textContent = aluno.nome;

    const tdTelefone = document.createElement("td");
    tdTelefone.textContent = aluno.telefone || "-";

    const tdFaixa = document.createElement("td");
    const beltTag = document.createElement("span");
    beltTag.className = "belt-tag";
    beltTag.style.background = cor;
    beltTag.textContent = aluno.faixa;
    tdFaixa.appendChild(beltTag);

    const tdNascimento = document.createElement("td");
    tdNascimento.textContent = aluno.nascimento
      ? new Date(aluno.nascimento + "T00:00:00").toLocaleDateString("pt-BR")
      : "-";

    const tdPresencas = document.createElement("td");
    tdPresencas.textContent = checkinsSnap.size;

    const tdMensalidade = document.createElement("td");
    const mensalidadeTag = document.createElement("span");
    mensalidadeTag.className = "mensalidade-tag " + (emDia ? "pago" : "pendente");
    mensalidadeTag.textContent = emDia ? "Pago" : "Pendente";
    const btnMensalidade = document.createElement("button");
    btnMensalidade.type = "button";
    btnMensalidade.className = "mensalidade-btn";
    btnMensalidade.textContent = emDia ? "Marcar pendente" : "Marcar pago";
    btnMensalidade.addEventListener("click", (e) => {
      e.stopPropagation();
      alterarMensalidade(doc.id, emDia ? "pendente" : "pago");
    });
    tdMensalidade.append(mensalidadeTag, btnMensalidade);

    tr.append(tdNome, tdTelefone, tdFaixa, tdNascimento, tdPresencas, tdMensalidade);
    tr.addEventListener("click", () => abrirHistorico(aluno.nome, checkinsSnap));

    tabelaAlunos.appendChild(tr);
  }
}

function gerarRelatorio() {
  const linhas = Array.from(tabelaAlunos.querySelectorAll("tr"))
    .filter((tr) => tr.querySelectorAll("td").length >= 6);

  relatorioImpressao.innerHTML = "";

  const titulo = document.createElement("h1");
  titulo.textContent = "Relatório de Presenças";
  relatorioImpressao.appendChild(titulo);

  if (linhas.length === 0) {
    const p = document.createElement("p");
    p.textContent = "Nenhum aluno cadastrado.";
    relatorioImpressao.appendChild(p);
  } else {
    const p = document.createElement("p");
    p.textContent = "Gerado em " + new Date().toLocaleDateString("pt-BR");
    relatorioImpressao.appendChild(p);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>Aluno</th><th>Check-ins</th><th>Mensalidade</th></tr>";
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    // Reconstrói cada linha via textContent (nunca innerHTML) — o nome do aluno
    // não é confiável mesmo já tendo passado pela tabela na tela.
    linhas.forEach((tr) => {
      const celulas = tr.querySelectorAll("td");
      const tagMensalidade = celulas[5].querySelector(".mensalidade-tag");
      const pendente = tagMensalidade && tagMensalidade.classList.contains("pendente");

      const linha = document.createElement("tr");
      const tdNome = document.createElement("td");
      tdNome.textContent = celulas[0].textContent;
      const tdCheckins = document.createElement("td");
      tdCheckins.textContent = celulas[4].textContent;
      const tdStatus = document.createElement("td");
      tdStatus.textContent = tagMensalidade ? tagMensalidade.textContent : "-";
      if (pendente) tdStatus.className = "relatorio-pendente";

      linha.append(tdNome, tdCheckins, tdStatus);
      tbody.appendChild(linha);
    });
    table.appendChild(tbody);
    relatorioImpressao.appendChild(table);
  }

  window.print();
}

async function alterarMensalidade(alunoId, novoStatus) {
  await db.collection("alunos").doc(alunoId).update({
    mensalidadeStatus: novoStatus,
    mensalidadeAtualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });
  carregarAlunos();
}

function abrirHistorico(nome, checkinsSnap) {
  modalTitulo.textContent = "Histórico - " + nome;
  modalLista.innerHTML = "";

  const docs = checkinsSnap.docs.slice().sort((a, b) => {
    const ta = a.data().timestamp ? a.data().timestamp.toMillis() : 0;
    const tb = b.data().timestamp ? b.data().timestamp.toMillis() : 0;
    return tb - ta;
  });

  if (docs.length === 0) {
    modalLista.innerHTML = "<li>Nenhuma presença registrada.</li>";
  } else {
    docs.forEach((doc) => {
      const li = document.createElement("li");
      li.innerHTML = "<span>Treino</span><span>" + formatDateTime(doc.data().timestamp) + "</span>";
      modalLista.appendChild(li);
    });
  }

  modalBackdrop.classList.add("show");
}
</script>
</body>
</html>
