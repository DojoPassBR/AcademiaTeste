<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Aluno - DojoPass</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="app.css?v=20260908">
</head>
<body>

<header class="app-header">
  <div class="logo-wrap">
    <img src="../assets/logo.svg" alt="Logo">
    <h1>Área do Aluno</h1>
  </div>
</header>

<main class="app-main">
  <div class="card">
    <h2>Criar Cadastro</h2>
    <form id="form-cadastro">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(15) 99999-9999" required>

      <label for="nascimento">Data de nascimento</label>
      <div class="date-input-wrap">
        <input type="date" id="nascimento" placeholder="dd/mm/aaaa" required>
        <button type="button" class="date-picker-btn" id="nascimento-abrir-calendario" aria-label="Abrir calendário">📅</button>
      </div>

      <label for="faixa">Faixa atual</label>
      <select id="faixa" required>
        <option value="">Selecione...</option>
        <option value="Branca">Branca</option>
        <option value="Cinza">Cinza (infantil)</option>
        <option value="Amarela">Amarela (infantil)</option>
        <option value="Laranja">Laranja (infantil)</option>
        <option value="Verde">Verde (infantil)</option>
        <option value="Azul">Azul</option>
        <option value="Roxa">Roxa</option>
        <option value="Marrom">Marrom</option>
        <option value="Preta">Preta</option>
      </select>

      <label for="email">E-mail</label>
      <input type="email" id="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" minlength="6" required>

      <label for="senha2">Confirmar senha</label>
      <input type="password" id="senha2" minlength="6" required>

      <button type="submit" class="btn" id="btn-cadastrar">Criar cadastro</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="switch-link">Já tem cadastro? <a href="login.html">Fazer login</a></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js?v=20260908"></script>
<script src="tenant-context.js?v=20260908"></script>
<script>
const form = document.getElementById("form-cadastro");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn-cadastrar");

// UX do <input type="date"> no Safari: ao digitar o dia, o foco não avança sozinho pro
// segmento de mês (diferente do Chrome). Esse comportamento é nativo do controle do
// navegador/SO e não há forma confiável de interceptar isso via JS sem recriar o input
// inteiro como um componente customizado (fora de escopo aqui - mais risco de quebrar
// acessibilidade do que benefício). Como mitigação pragmática, adicionamos um botão que
// abre o seletor de calendário nativo via showPicker(), suportado no Safari e Chrome
// modernos.
function abrirSeletorDeData(inputId, botaoId) {
  const input = document.getElementById(inputId);
  const botao = document.getElementById(botaoId);
  if (!input || !botao) return;
  botao.addEventListener("click", () => {
    try {
      input.showPicker();
    } catch (erro) {
      // showPicker() pode não existir (navegador antigo) ou lançar se não for chamado
      // a partir de um gesto do usuário. Nesses casos, cai no fallback de focar o input
      // para que o usuário abra o calendário do jeito nativo do navegador.
      input.focus();
    }
  });
}
abrirSeletorDeData("nascimento", "nascimento-abrir-calendario");

// Convite do professor: admin.html gera um link cadastro.html?nome=...&telefone=... só pra
// poupar digitação. Os campos continuam totalmente editáveis e nada disso é confiado como
// verdade — quem grava o documento em alunos/{uid} é o próprio aluno, sob as Firestore
// Rules. Os limites abaixo são os mesmos de dadosAlunoValidos nas rules.
const CONVITE_NOME_MAX = 99;
const CONVITE_TELEFONE_MAX = 29;

function preencherPorConvite() {
  let parametros;
  try {
    parametros = new URLSearchParams(window.location.search);
  } catch (erro) {
    return;
  }

  const nome = parametros.get("nome");
  const telefone = parametros.get("telefone");
  if (nome === null && telefone === null) return;

  let veioDeConvite = false;

  if (nome !== null) {
    const valor = nome.trim().slice(0, CONVITE_NOME_MAX);
    if (valor) {
      document.getElementById("nome").value = valor;
      veioDeConvite = true;
    }
  }

  if (telefone !== null) {
    const valor = telefone.trim().slice(0, CONVITE_TELEFONE_MAX);
    if (valor) {
      document.getElementById("telefone").value = valor;
      veioDeConvite = true;
    }
  }

  if (!veioDeConvite) return;

  const aviso = document.createElement("p");
  aviso.className = "config-dica";
  aviso.id = "convite-aviso";
  aviso.textContent = "Convite da sua academia — confira seus dados e escolha seu e-mail e senha.";
  form.parentNode.insertBefore(aviso, form);
}

preencherPorConvite();

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg show " + type;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const nascimento = document.getElementById("nascimento").value;
  const faixa = document.getElementById("faixa").value;
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const senha2 = document.getElementById("senha2").value;

  if (senha !== senha2) {
    showMsg("As senhas não coincidem.", "error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Criando...";

  try {
    await ensureTenantContext();
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    const token = await cred.user.getIdToken();
    const resp = await fetch(WORKER_URL + "/completar-cadastro", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify(tenantPayload({
        nome,
        telefone,
        nascimento,
        faixa,
        email
      }))
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) {
      throw new Error(data.erro || "Não foi possível concluir o cadastro.");
    }
    window.location.href = "checkin.html";
  } catch (err) {
    let text = "Erro ao criar cadastro. Tente novamente.";
    if (err.code === "auth/email-already-in-use") text = "Este e-mail já está cadastrado.";
    if (err.code === "auth/weak-password") text = "A senha precisa ter pelo menos 6 caracteres.";
    if (err.code === "auth/invalid-email") text = "E-mail inválido.";
    if (!err.code && err.message) text = err.message;
    showMsg(text, "error");
    btn.disabled = false;
    btn.textContent = "Criar cadastro";
  }
});
</script>
</body>
</html>
